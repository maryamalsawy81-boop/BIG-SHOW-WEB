
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101018">
<title>BIG SHOW</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial;text-align:center}
header{padding:35px 15px;background:linear-gradient(135deg,#25253b,#101018)}
h1{font-size:42px;color:#ffbd35;margin:5px}
header p{color:#bbb}
main{padding:20px;max-width:500px;margin:auto}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{background:#222233;border:1px solid #44445b;border-radius:18px;padding:25px 8px;font-size:19px;color:white}
.game span{display:block;font-size:38px;margin-bottom:12px}
button{background:#ffbd35;color:#151515;border:0;border-radius:12px;padding:12px 25px;font-size:17px;font-weight:bold}
#screen{display:none;padding:20px}
#gameArea{background:#222233;border-radius:15px;padding:20px;min-height:220px}
</style>
</head>
<body>
<header>
<h1>BIG SHOW</h1>
<p>أهلاً بك في عالم التحدي والألعاب</p>
</header>
<main id="home">
<h2>اختر لعبتك</h2>
<div class="games">
<button class="game" onclick="openGame('snake')"><span>🐍</span>لعبة الثعبان</button>
<button class="game" onclick="openGame('car')"><span>🏎️</span>سباق السيارات</button>
<button class="game" onclick="openGame('diff')"><span>🔍</span>أوجد الاختلاف</button>
<button class="game" onclick="openGame('photos')"><span>🖼️</span>معرض الصور</button>
</div>
</main>
<section id="screen">
<h2 id="gameTitle"></h2>
<div id="gameArea">اللعبة هتكون هنا</div>
<br>
<button onclick="goHome()">العودة للقائمة</button>
</section>
<script>
function openGame(name){
document.getElementById('home').style.display='none';
document.getElementById('screen').style.display='block';
let titles={snake:'🐍 لعبة الثعبان',car:'🏎️ سباق السيارات',diff:'🔍 أوجد الاختلاف',photos:'🖼️ معرض الصور'};
document.getElementById('gameTitle').textContent=titles[name];
}
function goHome(){
document.getElementById('screen').style.display='none';
document.getElementById('home').style.display='block';
}
</script>
</body>
</html>
